name: APK ve EXE Derle

# Yalnızca elle / script ile tetiklenir. Tek çalıştırma iki dosya üretir:
#   HizliAktar-apk  -> Android uygulaması (app-debug.apk)
#   HizliAktar-exe  -> Windows uygulaması (HizliAktar.exe)
# (Push'ta da çalışsın istersen "push:" ekle; ama manuel tetiklemeyle birlikte iki build olur.)
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: APK derle
        run: gradle --no-daemon assembleDebug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: HizliAktar-apk
          path: app/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklar
        run: pip install -r windows/requirements.txt pyinstaller

      - name: EXE derle
        run: pyinstaller --noconsole --onefile --name HizliAktar --paths windows windows/app.py

      - name: EXE yukle
        uses: actions/upload-artifact@v4
        with:
          name: HizliAktar-exe
          path: dist/HizliAktar.exe

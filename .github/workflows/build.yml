name: APK Derle

# Yalnızca elle / script ile tetiklenir -> her derlemede TEK build çıkar.
# (Push'ta da çalışsın istersen aşağıya "push:" bloğu ekle; ama o zaman
# hem push hem manuel tetikleme iki build üretir.)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: APK derle
        run: gradle --no-daemon assembleDebug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: HizliAktar-apk
          path: app/build/outputs/apk/debug/*.apk
